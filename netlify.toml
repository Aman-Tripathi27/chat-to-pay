# Netlify serves the single-page web app from web/dist. The repo also holds the Next.js
# server version, so Netlify's Next.js runtime is switched off: it would otherwise expect
# a Next.js build in the publish directory and fail the deploy.
[build]
  command = "npm run build:web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
